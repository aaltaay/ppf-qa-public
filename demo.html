<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Q&A Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 1.4em;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 20px;
        }
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }
        .module-selector {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .module-selector label {
            font-weight: 600;
            color: #555;
        }
        .module-selector select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            min-width: 280px;
        }
        .module-selector select:focus {
            outline: none;
            border-color: #4a90d9;
            box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.2);
        }
        .demo-note {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 16px;
        }
    </style>
    <link rel="stylesheet" href="frontend/widget.css">
</head>
<body>
    <div class="container" id="lesson-container" data-module-id="1">
        <div class="module-selector">
            <label for="module-select">Module:</label>
            <select id="module-select">
                <option value="1">Module 1 — Introduction</option>
                <option value="2">Module 2 — Core Concepts</option>
                <option value="3">Module 3 — Hands-On Lab</option>
            </select>
        </div>
        <h1 id="module-title">Module 1 — Introduction</h1>
        <p class="demo-note">
            Demo page for the Course Q&amp;A widget. Place sample MP4 files under <code>modules/</code>
            or use the bundled transcript corpus in <code>transcribe/demo_chunks.json</code>.
        </p>

        <div class="video-wrapper">
            <video id="course-video" controls>
                <source id="video-source" src="modules/module 1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script src="frontend/adapters/video/html5.js"></script>
    <script src="frontend/adapters/lesson/data-attr.js"></script>
    <script src="frontend/widget.js"></script>

    <script>
        const moduleSelect = document.getElementById('module-select');
        const moduleTitle = document.getElementById('module-title');
        const courseVideo = document.getElementById('course-video');
        const videoSource = document.getElementById('video-source');
        const lessonContainer = document.getElementById('lesson-container');

        moduleSelect.addEventListener('change', () => {
            const modNum = moduleSelect.value;
            const modText = moduleSelect.options[moduleSelect.selectedIndex].text;

            lessonContainer.setAttribute('data-module-id', modNum);
            moduleTitle.textContent = modText;
            videoSource.src = `modules/module ${modNum}.mp4`;
            courseVideo.load();
        });

        document.addEventListener('DOMContentLoaded', () => {
            CourseQAWidget.init({
                apiUrl: 'http://localhost:8001',
                videoAdapter: 'html5',
                lessonDetector: 'data-attr'
            });
        });
    </script>
</body>
</html>
